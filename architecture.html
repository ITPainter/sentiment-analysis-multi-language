<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Language Sentiment Analysis · Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · sentiment-analysis-multi-language</p>
    <h1>Multi-language sentiment analysis pipeline</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1000 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sentiment-architecture-title sentiment-architecture-desc">
        <title id="sentiment-architecture-title">Multi-language sentiment analysis pipeline</title>
        <desc id="sentiment-architecture-desc">Architecture diagram showing an Excel file flowing through language detection, sentiment inference, and chart generation, saved to the output folder, with model downloads from the Hugging Face Hub.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zone: processing pipeline (drawn before arrows and nodes) -->
        <rect x="364" y="96" width="184" height="308" rx="8"
              fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="400" y="100" width="112" height="12" rx="2" fill="#f5f5f5"/>
        <text x="456" y="109" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em">PROCESSING · SRC/</text>

        <!-- Arrows (behind boxes) -->
        <line x1="160" y1="260" x2="200" y2="260" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

        <!-- main.py -> data_excel.py (routed left of the AI module to avoid crossing it) -->
        <path d="M 320,260 H 340 Q 348,260 348,252 V 168 Q 348,160 356,160 H 380"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- data_excel.py -> core_models.py -->
        <path d="M 456,192 V 228" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- core_models.py -> data_charts.py -->
        <path d="M 456,292 V 328" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- core_models.py -> Hugging Face Hub (dashed, with hop over the SAVE PNG crossing) -->
        <path d="M 532,260 H 674 Q 682,260 682,268 V 352 a 8,8 0 0,0 0,16 V 428"
              fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <!-- data_excel.py -> Output -->
        <path d="M 532,160 H 854 Q 862,160 862,168 V 228"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- data_charts.py -> Output -->
        <path d="M 532,360 H 854 Q 862,360 862,352 V 292"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Arrow labels -->
        <rect x="162" y="240" width="36" height="12" rx="2" fill="#f5f5f5"/>
        <text x="180" y="249" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LOAD</text>

        <rect x="300" y="204" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="320" y="213" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PARSE</text>

        <rect x="464" y="204" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="496" y="213" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TEXT+LANG</text>

        <rect x="464" y="304" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="492" y="313" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RESULTS</text>

        <rect x="573" y="268" width="60" height="12" rx="2" fill="#f5f5f5"/>
        <text x="603" y="277" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DOWNLOAD</text>

        <rect x="661" y="168" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="693" y="177" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SAVE XLSX</text>

        <rect x="665" y="336" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="693" y="345" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SAVE PNG</text>

        <!-- Node: Excel Input -->
        <rect x="40" y="228" width="120" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="228" width="120" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <rect x="48" y="236" width="28" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
        <text x="62" y="245" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">IN</text>
        <text x="100" y="264" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Excel Input</text>
        <text x="100" y="280" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">output/*.xlsx</text>

        <!-- Node: main.py (focal) -->
        <rect x="200" y="228" width="120" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="200" y="228" width="120" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="208" y="236" width="28" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
        <text x="222" y="245" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RUN</text>
        <text x="260" y="264" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Main</text>
        <text x="260" y="280" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">main.py</text>

        <!-- Node: data_excel.py -->
        <rect x="380" y="128" width="152" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="380" y="128" width="152" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="388" y="136" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="402" y="145" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">XLS</text>
        <text x="456" y="164" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Excel Processor</text>
        <text x="456" y="180" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">data_excel.py</text>

        <!-- Node: core_models.py -->
        <rect x="380" y="228" width="152" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="380" y="228" width="152" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="388" y="236" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="402" y="245" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AI</text>
        <text x="456" y="264" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Sentiment Models</text>
        <text x="456" y="280" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">core_models.py</text>

        <!-- Node: data_charts.py -->
        <rect x="380" y="328" width="152" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="380" y="328" width="152" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="388" y="336" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="402" y="345" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VIZ</text>
        <text x="456" y="364" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Visualizer</text>
        <text x="456" y="380" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">data_charts.py</text>

        <!-- Node: Output (store) -->
        <rect x="792" y="228" width="140" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="792" y="228" width="140" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="800" y="236" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
        <text x="814" y="245" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OUT</text>
        <text x="862" y="264" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Results</text>
        <text x="862" y="280" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">xlsx + png</text>

        <!-- Node: Hugging Face Hub (external, dashed) -->
        <rect x="612" y="428" width="140" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="612" y="428" width="140" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,4"/>
        <rect x="620" y="436" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
        <text x="634" y="445" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
        <text x="682" y="464" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Model Hub</text>
        <text x="682" y="480" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">huggingface.co</text>

        <!-- Legend strip -->
        <line x1="40" y1="516" x2="960" y2="516" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="532" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="548" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="60" y="556" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Entry point</text>

        <rect x="172" y="548" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="192" y="556" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Pipeline module</text>

        <rect x="332" y="548" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="352" y="556" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Output store</text>

        <rect x="456" y="548" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="476" y="556" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">User input</text>

        <rect x="572" y="548" width="14" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="3,3"/>
        <text x="592" y="556" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">External service</text>

        <line x1="716" y1="553" x2="744" y2="553" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <text x="752" y="556" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Model download</text>
      </svg>
    </div>
  </div>
</body>
</html>
